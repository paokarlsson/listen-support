# Talmoln – inställningar. Alla värden har standardvärden i app/config.py,
# så det räcker att ange det du vill ändra.

[server]
host = "127.0.0.1"
port = 8000

[transcriber]
# "whispercpp" = pywhispercpp (rekommenderat)
# "cli"        = anropa whisper-cli via subprocess (reservplan om pywhispercpp inte bygger)
# "stub"       = ingen transkribering, bara eko av ljudmängd (fas 1 / felsökning)
backend = "whispercpp"
model_path = "models/ggml-base.bin"
language = "sv"
threads = 4
# Endast för backend = "cli"
cli_binary = "whisper-cli"
# Skicka slutet av förra biten som prompt till Whisper. Ger bättre sammanhang
# över chunk-gränser men kan ibland få Whisper att upprepa sig.
use_prompt = true

[audio]
sample_rate = 16000
# Sikta på bitar om ~6 s. Klipp i den tystaste punkten inom sök-fönstret.
chunk_seconds = 6.0
max_chunk_seconds = 9.0
cut_search_seconds = 2.0
# Energibaserad VAD: bitar vars RMS (int16-skala) ligger under detta hoppas över.
vad_rms_threshold = 250.0

[topics]
# Ordmolnet kommer helt från ämneslagret. Det skickar transkriberad TEXT (aldrig ljud) till Claude API.
# Kräver ANTHROPIC_API_KEY i miljön eller i .env. Utan nyckel visas bara transkriptet.
enabled = true                 # startläge – kan slås av/på i appen
model = "claude-haiku-5-5"
interval_seconds = 20.0        # som tätast ett anrop per intervall …
min_new_words = 20             # … och bara om så här många nya ord har kommit
window_seconds = 180.0         # hur många sekunder bakåt av transkriptet som skickas
max_topics = 8
timeout_seconds = 15.0
half_life_seconds = 120.0      # ämnesvikter avklingar mellan anropen
show_keywords = true           # visa ämnenas ord (från Claude) som mindre ord runt ämnet
keyword_factor = 0.45          # ett ämnesords storlek relativt sitt ämne
max_words = 40
tick_seconds = 2.0             # hur ofta avklingade vikter skickas till klienten
